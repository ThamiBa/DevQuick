<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Clean High-End White Background -->
  <rect width="1280" height="420" fill="#FFFFFF"/>
  <rect width="1280" height="420" fill="url(#subtle_dots)" opacity="0.05"/>
  
  <defs>
    <!-- Logo & Text Gradient (Purple to Cyan-Blue) -->
    <linearGradient id="brand_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA"/> <!-- Purple -->
      <stop offset="50%" stop-color="#7C3AED"/> <!-- Violet -->
      <stop offset="100%" stop-color="#06B6D4"/> <!-- Cyan -->
    </linearGradient>

    <!-- Subtle Shadow for Depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.1"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="subtle_dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#000000"/>
    </pattern>
  </defs>

  <!-- Top-Left AI Accent -->
  <text x="40" y="60" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#F3F4F6">Ai</text>

  <!-- Layout Group (Centered Alignment) -->
  <g transform="translate(160, 210)">
    
    <!-- Logo Recreations (Based on Image) -->
    <g transform="translate(0, -110) scale(0.22)" filter="url(#shadow)">
      <!-- Motion Lines -->
      <rect x="-180" y="480" width="120" height="60" rx="30" fill="url(#brand_grad)" />
      <rect x="-400" y="480" width="180" height="60" rx="30" fill="url(#brand_grad)" />
      <rect x="-250" y="380" width="140" height="50" rx="25" fill="url(#brand_grad)" />
      <rect x="-80" y="320" width="100" height="50" rx="25" fill="url(#brand_grad)" />
      <rect x="-130" y="580" width="130" height="50" rx="25" fill="url(#brand_grad)" />
      <rect x="-300" y="650" width="210" height="60" rx="30" fill="url(#brand_grad)" />

      <!-- Main Logo Body (D/R Hybrid) -->
      <path d="M150 150 H650 C900 150 1100 350 1100 600 C1100 850 900 1050 650 1050 H150 V150" stroke="url(#brand_grad)" stroke-width="100" stroke-linejoin="round" fill="none"/>
      <path d="M350 350 H650 C790 350 900 460 900 600 C900 740 790 850 650 850 H350 V350" stroke="url(#brand_grad)" stroke-width="80" stroke-linejoin="round" fill="none"/>
      <rect x="150" y="560" width="500" height="80" rx="40" fill="url(#brand_grad)" />
      <circle cx="650" cy="600" r="110" fill="url(#brand_grad)" />
      <path d="M780 810 L1050 1080" stroke="url(#brand_grad)" stroke-width="110" stroke-linecap="round" />
    </g>

    <!-- Text Group (Vertically Centered to Logo) -->
    <g transform="translate(320, 15)">
      <text x="0" y="0" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-weight="900" font-size="94" fill="url(#brand_grad)" filter="url(#shadow)">Thami Baladi</text>
      <text x="2" y="68" font-family="'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="38" fill="#1F2937" opacity="0.8">Software &amp; AI Engineering • Fullstack Developer</text>
    </g>
  </g>
</svg>
