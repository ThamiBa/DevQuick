<svg width="512" height="512" viewBox="0 0 1200 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logo_grad_square" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Recreated Logo from your inspiration image -->
  <g transform="translate(420, 100) scale(0.9)">
    <!-- Speed Lines on left -->
    <rect x="-150" y="480" width="100" height="50" rx="25" fill="url(#logo_grad_square)" />
    <rect x="-350" y="480" width="150" height="50" rx="25" fill="url(#logo_grad_square)" />
    <rect x="-200" y="380" width="120" height="40" rx="20" fill="url(#logo_grad_square)" />
    <rect x="-50" y="320" width="80" height="40" rx="20" fill="url(#logo_grad_square)" />
    <rect x="-100" y="580" width="100" height="40" rx="20" fill="url(#logo_grad_square)" />
    <rect x="-250" y="650" width="180" height="50" rx="25" fill="url(#logo_grad_square)" />
    
    <!-- Outer "D" Border -->
    <path d="M150 150 H650 C900 150 1100 350 1100 600 C1100 850 900 1050 650 1050 H150 V150 " stroke="url(#logo_grad_square)" stroke-width="80" stroke-linejoin="round" fill="none" />
    
    <!-- Inner "D" Border -->
    <path d="M350 350 H650 C790 350 900 460 900 600 C900 740 790 850 650 850 H350 V350" stroke="url(#logo_grad_square)" stroke-width="60" stroke-linejoin="round" fill="none" />
    
    <!-- The Line and Dot -->
    <rect x="150" y="570" width="500" height="60" rx="30" fill="url(#logo_grad_square)" />
    <circle cx="650" cy="600" r="85" fill="url(#logo_grad_square)" />
    
    <!-- The Leg for "R" lookup -->
    <path d="M780 810 L980 1050" stroke="url(#logo_grad_square)" stroke-width="90" stroke-linecap="round" />
  </g>
</svg>
